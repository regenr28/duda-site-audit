<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Duda Site Auditor</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2563eb">
  <script>
    // Applied before anything is drawn, so a dark or coloured theme never flashes white first.
    (function () {
      var m = 'auto', t = 'blue';
      try { var a = JSON.parse(localStorage.getItem('dsa-look') || '{}'); m = a.mode || m; t = a.theme || t; } catch (e) {}
      var dark = m === 'dark' || (m !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      var h = document.documentElement; h.dataset.appearance = m; h.dataset.theme = t; h.dataset.scheme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css?v=3">
</head>
<body>
  <header class="topbar">
    <button class="btn ghost nav-burger" id="btnNav" type="button" aria-label="Open the menu" aria-controls="sideNav" aria-expanded="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="brand" href="#/home">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 16.5l4.5 4.5L23 11" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand-t">Duda Site Auditor</span>
    </a>
    <div class="topbar-actions" id="topRight"></div>
  </header>

  <div id="previewBar"></div>
  <div class="shell">
    <nav id="sideNav" class="sidenav" aria-label="Main menu"></nav>
    <div class="shell-main">
      <div id="pageIntro"></div>
      <main id="view" class="container"></main>
    </div>
  </div>
  <div id="navScrim" class="nav-scrim" hidden></div>
  <nav id="tabBar" class="tabbar" aria-label="Quick menu"></nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <script src="/engine.js?v=2"></script>
  <script src="/app.js?v=3"></script>
</body>
</html>
